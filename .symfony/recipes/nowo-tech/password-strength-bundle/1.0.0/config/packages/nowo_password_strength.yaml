nowo_password_strength:
    form_theme: bootstrap_5_layout.html.twig
    feedback_position: below
    show_requirements: true
    live_feedback: true
    default_profile: medium
    generator_mode: off
    use_password_toggle: true
    # csp_nonce_attribute: csp_nonce   # request attribute with the CSP nonce (2.6+); empty string disables
    # weak / medium / strong are built in; entries below override them or add new profiles.
    profiles:
        weak:
            min_length: 6
        medium:
            min_length: 8
            require_lowercase: true
            require_uppercase: true
            require_digit: true
        strong:
            min_length: 12
            require_lowercase: true
            require_uppercase: true
            require_digit: true
            require_special: true
