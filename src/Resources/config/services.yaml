services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Nowo\PasswordStrengthBundle\:
    resource: '../../*'
    exclude:
      - '../../DependencyInjection/'
      - '../../PasswordStrengthBundle.php'
      - '../../Model/'

  Nowo\PasswordStrengthBundle\Profile\ConfigPasswordProfileProvider:
    arguments:
      $levels: '%nowo_password_strength.profiles%'

  # Port for the named profiles (policy_mode: level). Override this alias to serve profiles from your own store.
  Nowo\PasswordStrengthBundle\Profile\PasswordProfileProviderInterface:
    alias: Nowo\PasswordStrengthBundle\Profile\ConfigPasswordProfileProvider

  Nowo\PasswordStrengthBundle\Service\PolicyResolver:
    arguments:
      $levels: '%nowo_password_strength.profiles%'
      $defaultLevel: '%nowo_password_strength.default_profile%'
      $profiles: '@Nowo\PasswordStrengthBundle\Profile\PasswordProfileProviderInterface'

  # Ports (REQ-ARCH-001 rule 1): autowire the interface; override the alias to replace the default implementation.
  Nowo\PasswordStrengthBundle\Service\PolicyResolverInterface:
    alias: Nowo\PasswordStrengthBundle\Service\PolicyResolver

  Nowo\PasswordStrengthBundle\Service\PasswordStrengthEvaluatorInterface:
    alias: Nowo\PasswordStrengthBundle\Service\PasswordStrengthEvaluator

  Nowo\PasswordStrengthBundle\Service\PasswordPatternBuilderInterface:
    alias: Nowo\PasswordStrengthBundle\Service\PasswordPatternBuilder

  Nowo\PasswordStrengthBundle\Form\PasswordStrengthType:
    arguments:
      $defaultFeedbackPosition: '%nowo_password_strength.feedback_position%'
      $defaultShowRequirements: '%nowo_password_strength.show_requirements%'
      $defaultLiveFeedback: '%nowo_password_strength.live_feedback%'
      $defaultGeneratorMode: '%nowo_password_strength.generator_mode%'
      $defaultGeneratorCount: '%nowo_password_strength.generator_count%'
      $defaultUsePasswordToggle: '%nowo_password_strength.use_password_toggle%'
      $parentFormType: '%nowo_password_strength.parent_form_type%'
      $defaultLevel: '%nowo_password_strength.default_profile%'
      $requestStack: '@?request_stack'
      $cspNonceAttribute: '%nowo_password_strength.csp_nonce_attribute%'
      $defaultUiTranslationDomain: '%nowo_password_strength.ui_translation_domain%'
      $defaultUiClasses: '%nowo_password_strength.ui_classes%'
    tags:
      - { name: form.type }

  Nowo\PasswordStrengthBundle\Validator\PasswordStrengthValidator:
    tags:
      - { name: validator.constraint_validator }
